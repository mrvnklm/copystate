<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Copystate</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon-32.png" alt="" width="20" height="20" />
      <h1 data-i18n="shortName">Copystate</h1>
    </header>

    <fieldset class="scope">
      <legend data-i18n="scopeLabel"></legend>
      <label><input type="radio" name="scope" value="main" checked /><span data-i18n="scopeMain"></span></label>
      <label><input type="radio" name="scope" value="page" /><span data-i18n="scopePage"></span></label>
    </fieldset>

    <p id="status" role="status" aria-live="polite" data-state="busy"></p>

    <textarea id="output" readonly spellcheck="false" wrap="off"></textarea>

    <div class="actions">
      <div id="probe-row" hidden>
        <button id="probe" type="button" aria-describedby="probe-hint"></button>
        <small id="probe-hint" data-i18n="probeHint"></small>
      </div>
      <button id="copy" type="button" class="primary" data-i18n="copyButton" disabled></button>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
